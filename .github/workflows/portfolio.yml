name: Portfolio examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run workflow:check
      - run: npm run demo
  native-n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned demonstration runtime
        run: npm ci --prefix automation-demos/order-fulfilment/runtime --legacy-peer-deps --no-audit --no-fund
      - name: Import and execute twice in an isolated n8n instance
        run: N8N_BIN="$GITHUB_WORKSPACE/automation-demos/order-fulfilment/runtime/node_modules/.bin/n8n" npm run demo:n8n
